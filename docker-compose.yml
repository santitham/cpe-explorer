services:
  cpe-explorer:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    image: cpe-explorer:latest
    container_name: cpe-explorer
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - ADMIN_KEY=${ADMIN_KEY:-}
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - MAX_ENTRIES=${MAX_ENTRIES:-5000}
    volumes:
      - ./data:/app/data
