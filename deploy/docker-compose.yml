# Run CPE Explorer from the published image — no source code needed on the server.
#   1. Put this file and a .env file (see ../.env.example) in a folder on the server.
#   2. docker compose up -d
#   Update later:  docker compose pull && docker compose up -d
services:
  cpe-explorer:
    image: ghcr.io/santitham/cpe-explorer:latest
    container_name: cpe-explorer
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - ADMIN_KEY=${ADMIN_KEY:-}
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - MAX_ENTRIES=${MAX_ENTRIES:-5000}
    volumes:
      - ./data:/app/data
