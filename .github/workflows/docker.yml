name: Build and publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Quick check (server syntax + files present)
        run: |
          node --check server.js
          test -f public/index.html && test -f public/data/world.js && test -f public/vendor/three/three.min.js

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run the published image exactly as the README says
        run: |
          IMG=ghcr.io/${{ github.repository }}:sha-$(echo $GITHUB_SHA | cut -c1-7)
          docker run -d --name cpe-explorer --restart unless-stopped -p 8080:8080 \
            -e ADMIN_KEY=ci-test-key -v cpe-data:/app/data "$IMG"
          for i in $(seq 1 30); do curl -fs localhost:8080/api/health && break; sleep 1; done
      - name: Game page and assets are served
        run: |
          curl -fs localhost:8080/ | grep -q "CPE Explorer"
          curl -fsI localhost:8080/vendor/three/three.min.js | grep -qi "200"
          curl -fsI localhost:8080/fonts/mitr-thai-400-normal.woff2 | grep -qi "font/woff2"
          curl -fsI localhost:8080/img/CPE-101.webp | grep -qi "image/webp"
      - name: Scoreboard accepts a real score and rejects a fake one
        run: |
          curl -fs -X POST localhost:8080/api/scores -H 'Content-Type: application/json' \
            -d '{"id":"citest01","nick":"CI","score":30,"seen":3,"stars":0,"shards":0,"istars":0,"title":"","form":"Bit","lv":2}'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/api/scores -H 'Content-Type: application/json' \
            -d '{"id":"citest02","nick":"Cheat","score":99999,"seen":81,"stars":79,"shards":12,"istars":12,"title":"","form":"Bit"}')
          test "$code" = "422"
          curl -fs -H "X-Admin-Key: ci-test-key" localhost:8080/api/admin/scores | grep -q citest01
      - name: Scores survive replacing the container (update procedure)
        run: |
          sleep 1
          docker rm -f cpe-explorer
          docker run -d --name cpe-explorer -p 8080:8080 -v cpe-data:/app/data ghcr.io/${{ github.repository }}:sha-$(echo $GITHUB_SHA | cut -c1-7)
          for i in $(seq 1 30); do curl -fs localhost:8080/api/health && break; sleep 1; done
          curl -fs localhost:8080/api/scores | grep -q '"nick":"CI"'
      - name: Show logs on failure
        if: failure()
        run: docker logs cpe-explorer || true
