<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="CPE Explorer: walk Bit across a campus where every tile is a real KMUTT Computer Engineering course.">
<meta name="theme-color" content="#8fd3ff">
<title>CPE Explorer</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: full-screen sunny 3D island; compact frosted HUD on top; course card is an image-led side panel (wide) or bottom sheet (phone). */
:root{
  --sky:#2f9be0; --mint:#14b88b; --lilac:#7f63ee; --pink:#e5579c; --gold:#e09a00; --peach:#f0864d; --danger:#e5486c;
  --ink:#2c2850; --muted:#77729a; --line:rgba(127,99,238,.18);
  --panel:rgba(255,255,255,.86); --panel-2:#f4f1ff; --chip:#efeaff;
  --display:"Chakra Petch","Mitr",system-ui,sans-serif;
  --body:"Mitr",system-ui,sans-serif;
  --r:20px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#bfe6ff;color:var(--ink);font-family:var(--body);font-weight:400;overflow:hidden;-webkit-tap-highlight-color:transparent}
#sky{position:fixed;inset:0;background:linear-gradient(#8fd3ff,#d7efff 55%,#ffe6cc)}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}
.eyebrow{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--lilac)}
.btn{appearance:none;border:none;background:var(--chip);color:var(--ink);border-radius:999px;padding:11px 20px;font-family:var(--display);font-weight:700;letter-spacing:.03em;cursor:pointer;box-shadow:0 3px 0 rgba(127,99,238,.18);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(127,99,238,.18)}
.btn.primary{background:linear-gradient(#6ff0c4,#1fc596);color:#fff;text-shadow:0 1px 0 rgba(0,90,60,.25);box-shadow:0 4px 0 #109a73}
.btn.small{padding:7px 13px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:default}
:is(.btn,.icon-btn,.chip,.opt,.lead-chip,.career,.pp-tile,.more,input):focus-visible{outline:3px solid #7f63ee;outline-offset:2px}
.icon-btn{appearance:none;width:46px;height:46px;border-radius:16px;border:none;background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--lilac);box-shadow:0 4px 14px rgba(70,60,140,.16);backdrop-filter:blur(10px)}
.icon-btn svg{width:22px;height:22px}
.icon-btn[aria-pressed="false"]{color:#b4aed4}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;z-index:5}
#hud > *{pointer-events:auto}
.hud-card{background:var(--panel);border-radius:var(--r);padding:10px 14px;box-shadow:0 6px 22px rgba(70,60,140,.16);backdrop-filter:blur(12px)}
.where{font-family:var(--display);font-weight:700;font-size:14px;color:var(--ink)}
.goal{font-size:12.5px;color:var(--muted);margin-top:1px}
.goal b{color:var(--mint);font-weight:500}
.icons{display:flex;gap:12px;margin-top:7px;flex-wrap:wrap}
.ico{display:inline-flex;align-items:center;gap:4px;font-family:var(--display);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.ico svg{width:17px;height:17px}
.ico.c svg{color:var(--mint)} .ico.s svg{color:var(--gold)} .ico.d svg{color:var(--pink)}
.evo-row{margin-top:8px;display:flex;align-items:center;gap:8px}
.evo-label{font-size:12px;color:var(--muted);white-space:nowrap}
.evo-label b{color:var(--gold);font-weight:500}
.bar{flex:1;min-width:70px;height:7px;border-radius:99px;background:#ece8fb;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ffd166,#ff9a62,#ff7eb6);transition:width .4s}
.score-card{text-align:right}
.score-card small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--display);font-weight:700;font-size:28px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.career-dot{margin-top:5px;font-size:12px;color:var(--muted)}
.stat-row{appearance:none;border:none;background:#f6f3ff;position:relative;border-radius:14px;margin-top:8px;padding:5px 8px 5px 5px;display:flex;align-items:center;gap:8px;width:100%;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.stat-row:hover{background:#efeaff}
.stat-row .av{width:32px;height:32px;flex:none}
.stat-row .who{flex:1;min-width:0;line-height:1.15}
.stat-row .who b{display:block;font-family:var(--display);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-row .who small{font-size:11px;color:var(--muted)}
.eq{display:flex;align-items:flex-end;gap:2px;height:24px;flex:none}
.eq i{width:5px;border-radius:3px 3px 1px 1px;background:var(--c);min-height:2px;transition:height .5s}
.stat-pop{position:fixed;z-index:25;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:3px;transform:translate(-50%,-100%);animation:statUp 1.9s ease-out forwards}
.stat-pop span{font-family:var(--display);font-weight:700;font-size:13px;padding:3px 9px;border-radius:999px;background:#fff;color:var(--c);box-shadow:0 3px 10px rgba(70,60,140,.18);white-space:nowrap}
.stat-pop span.lv{background:linear-gradient(#ffd66e,#f0a400);color:#fff}
@keyframes statUp{0%{opacity:1;margin-top:8px}12%{opacity:1;margin-top:0}75%{opacity:1}100%{opacity:0;margin-top:-34px}}
.st-head{display:flex;gap:14px;align-items:center}
.st-head .av{width:76px;height:76px;flex:none}
.st-title{display:inline-block;margin-top:5px;font-family:var(--display);font-weight:700;font-size:13px;padding:4px 11px;border-radius:999px;color:#fff;background:var(--c)}
.st-lv{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.st-lv b{font-family:var(--display);color:var(--ink);font-size:15px}
.st-body{display:grid;grid-template-columns:200px 1fr;gap:14px;align-items:center;margin-top:12px}
.st-body svg{width:100%;height:auto}
.st-list{display:grid;gap:7px}
.st-item{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:13px}
.st-item span{color:var(--ink)}
.st-item em{font-style:normal;font-family:var(--display);font-weight:700;color:var(--c);font-variant-numeric:tabular-nums}
.st-item .bar{grid-column:1/-1;height:8px}
.st-item .bar i{background:var(--c)}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.skill{border-radius:14px;padding:9px 11px;background:#fff;box-shadow:0 0 0 1.5px var(--line);font-size:12px;color:var(--muted);line-height:1.35}
.skill b{display:block;font-family:var(--display);font-size:13.5px;color:var(--c)}
.skill.on{box-shadow:0 0 0 2px var(--c);background:#fff}
.gain-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.gain{font-family:var(--display);font-weight:700;font-size:12px;padding:3px 9px;border-radius:999px;color:var(--c);background:#fff;box-shadow:0 0 0 1.5px var(--c)}
.el-card .gl{font-family:var(--display);font-weight:700;font-size:11px;color:var(--c);margin-top:2px}
.stat-row.deco-apprentice{box-shadow:0 0 0 1.5px var(--c1) inset;background:color-mix(in srgb,var(--c1) 8%,#fff)}
.stat-row.deco-final{background:color-mix(in srgb,var(--c1) 10%,#fff)}
.stat-row.deco-final::before{content:"";position:absolute;inset:0;border-radius:14px;padding:2px;background:linear-gradient(110deg,var(--c1),#fff8,var(--c2),var(--c1));background-size:250% 100%;animation:shim 3.5s linear infinite;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
@keyframes shim{to{background-position:-250% 0}}
.mcard.st-card{position:relative;padding-top:0;overflow:hidden}
.st-card.tier-apprentice{box-shadow:0 0 0 2px var(--c1),0 30px 80px rgba(70,60,140,.3)}
.st-card.tier-final{box-shadow:0 0 0 3px var(--c1),0 0 34px color-mix(in srgb,var(--c1) 45%,transparent),0 30px 80px rgba(70,60,140,.3)}
.st-card.tier-final::before{content:"";position:absolute;inset:0;border-radius:28px;padding:3px;background:linear-gradient(110deg,var(--c1),#fff,var(--c2),var(--c1));background-size:250% 100%;animation:shim 4s linear infinite;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:3}
.st-banner{position:relative;height:136px;margin:0 -22px 10px;background:linear-gradient(135deg,var(--c1),var(--c2))}
.ban-img{position:absolute;inset:0;background-size:cover;background-position:right center}
.ban-img.left{transform:scaleX(-1)}
.ban-img.right{clip-path:polygon(58% 0,100% 0,100% 100%,42% 100%)}
.ban-img.left{clip-path:polygon(42% 0,100% 0,100% 100%,58% 100%)}
.seam{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.tier-student .ban-img,.tier-apprentice .ban-img{filter:saturate(.6) brightness(1.06)}
.tier-apprentice .st-banner::before,.tier-student .st-banner::before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.32);z-index:1}
.st-av{position:absolute;left:22px;bottom:-40px;width:84px;height:84px;border-radius:50%;background:#fff;padding:4px;box-shadow:0 6px 18px rgba(70,60,140,.22);z-index:2}
.tier-apprentice .st-av{box-shadow:0 0 0 3px var(--c1),0 6px 18px rgba(70,60,140,.22)}
.tier-final .st-av{background:linear-gradient(135deg,var(--c1),var(--c2));padding:4px}
.st-av svg{width:100%;height:100%;display:block}
.spark{position:absolute;color:#fff;font-style:normal;font-size:16px;text-shadow:0 0 8px #fff;animation:twk 2.4s ease-in-out infinite;z-index:1}
@keyframes twk{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
.st-name{margin-left:112px;min-height:58px}
.st-name h2{margin:2px 0 0}
.st-title{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-family:var(--display);font-weight:700;font-size:14px;padding:4px 14px 4px 5px;border-radius:999px;color:#fff;background:linear-gradient(90deg,var(--c1),var(--c2))}
.st-title.ribbon{border-radius:4px;padding:5px 26px 5px 8px;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 50%,100% 100%,0 100%,12px 50%);padding-left:18px;box-shadow:none;font-size:15px}
.emb{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.emb svg{width:16px;height:16px}
.st-card .st-lv .bar i{background:linear-gradient(90deg,var(--c1),var(--c2))}
.st-card .skill.on{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:center}
.st-card .skill.on .emb{grid-row:span 2}
.st-card .skill.on span:not(.emb){grid-column:2;font-size:11.5px}
.st-card .skill b{font-size:13.5px}
@media (max-width:520px){.st-banner{height:110px;margin:0 -18px 8px}.st-av{left:18px;width:76px;height:76px;bottom:-38px}.st-name{margin-left:100px}}
.hud-card.char{position:relative;overflow:hidden;padding-top:0;min-width:250px;transition:box-shadow .3s}
.ch-head{appearance:none;border:none;background:none;font:inherit;color:inherit;cursor:pointer;display:flex;align-items:flex-end;gap:9px;width:calc(100% + 28px);margin:0 -14px 6px;padding:22px 12px 7px;position:relative;text-align:left}
.ch-ban{position:absolute;inset:0;overflow:hidden;background:linear-gradient(135deg,var(--c1),var(--c2))}
.ch-ban::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(255,255,255,0) 0%,rgba(255,255,255,.35) 45%,rgba(255,255,255,.95) 100%);z-index:1}
.ch-ban .ban-img{background-size:cover;background-position:right 30%}
.ch-ban .spark{font-size:11px;z-index:2}
.tier-student .ch-ban .ban-img,.tier-apprentice .ch-ban .ban-img{filter:saturate(.6) brightness(1.06);opacity:.75}
.ch-av{position:relative;z-index:2;width:46px;height:46px;flex:none;border-radius:50%;background:#fff;padding:2px;box-shadow:0 3px 10px rgba(70,60,140,.2)}
.tier-apprentice .ch-av{box-shadow:0 0 0 2px var(--c1),0 3px 10px rgba(70,60,140,.2)}
.tier-final .ch-av{background:linear-gradient(135deg,var(--c1),var(--c2));padding:3px}
.ch-av svg{width:100%;height:100%;display:block}
.ch-who{position:relative;z-index:2;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0;flex:1}
.ch-who small{font-size:11px;color:#5a5480;padding-left:2px}
.ch-title{display:inline-flex;align-items:center;gap:4px;max-width:100%;font-family:var(--display);font-weight:700;font-size:12.5px;line-height:1.2;padding:2px 10px 2px 3px;border-radius:999px;color:#fff;background:linear-gradient(90deg,var(--c1),var(--c2));white-space:nowrap}
.ch-title > span:last-child{overflow:hidden;text-overflow:ellipsis}
.ch-title .emb{width:18px;height:18px;box-shadow:0 0 0 1.5px rgba(255,255,255,.85)}
.ch-title .emb svg{width:12px;height:12px}
.ch-title.ribbon{border-radius:3px;padding:3px 18px 3px 12px;clip-path:polygon(0 0,100% 0,calc(100% - 8px) 50%,100% 100%,0 100%,8px 50%)}
.hud-card.char.tier-apprentice{box-shadow:0 0 0 2px var(--c1),0 6px 22px rgba(70,60,140,.16)}
.hud-card.char.tier-final{box-shadow:0 0 0 2.5px var(--c1),0 0 22px color-mix(in srgb,var(--c1) 40%,transparent),0 6px 22px rgba(70,60,140,.16)}
.hud-card.char.tier-final::before{content:"";position:absolute;inset:0;border-radius:var(--r);padding:2.5px;background:linear-gradient(110deg,var(--c1),#fff,var(--c2),var(--c1));background-size:250% 100%;animation:shim 4s linear infinite;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:3}
.hud-card.char.tier-final .bar i,.hud-card.char.tier-apprentice .bar i{background:linear-gradient(90deg,var(--c1),var(--c2))}
.hud-card.char::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:45%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.85),transparent);transform:skewX(-18deg);opacity:0;pointer-events:none;z-index:4}
.hud-card.char.shine::after{animation:sweep 1.2s ease-out}
@keyframes sweep{0%{left:-60%;opacity:1}100%{left:130%;opacity:1}}
#h-eq{height:16px;margin-left:2px}
#h-eq i{width:4px}
@media (max-width:520px){.hud-card.char{min-width:0}.ch-head{padding:16px 9px 5px;margin:0 -11px 5px;width:calc(100% + 22px);gap:7px}.ch-av{width:36px;height:36px}.ch-title{font-size:11.5px}.ch-who small{font-size:10.5px}}
@media (prefers-reduced-motion:reduce){.hud-card.char::before{animation:none}.hud-card.char.shine::after{animation:none}}
@media (prefers-reduced-motion:reduce){.spark,.st-card.tier-final::before,.stat-row.deco-final::before{animation:none}}
@media (max-width:520px){.st-body{grid-template-columns:1fr}.st-body svg{max-width:220px;margin:0 auto}.stat-row .who b{font-size:12px}}
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;gap:4px;padding:5px;border-radius:999px;background:var(--panel);box-shadow:0 6px 22px rgba(70,60,140,.18);backdrop-filter:blur(12px);z-index:5;max-width:calc(100vw - 32px);overflow-x:auto}
.chip{appearance:none;cursor:pointer;border:none;background:transparent;color:var(--muted);border-radius:999px;padding:8px 12px;font-family:var(--display);font-weight:700;font-size:12.5px;white-space:nowrap}
.chip[aria-current="true"]{background:linear-gradient(#a58dff,#7f63ee);color:#fff}
.chip[disabled]{opacity:.4;cursor:default}
.chip .stars{margin-left:5px;letter-spacing:1px;color:#ffb400}
.chip .stars i{font-style:normal;opacity:.3}
.chip[aria-current="true"] .stars{color:#fff3b0}
.rot-pair{display:flex;gap:6px;margin-bottom:6px}
.lang-dock{font-family:var(--body);font-weight:500;font-size:13px}
.lang-sw{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--chip);margin-top:12px}
.lang-b{appearance:none;border:none;background:transparent;border-radius:999px;padding:5px 14px;font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted);cursor:pointer}
.lang-b[aria-pressed="true"]{background:#fff;color:var(--lilac);box-shadow:0 1px 4px rgba(70,60,140,.15)}
html[lang="th"] .cname, html[lang="th"] h2, html[lang="th"] .q, html[lang="th"] .where{font-family:"Mitr",system-ui,sans-serif;font-weight:500}
html[lang="th"] .eyebrow{letter-spacing:.04em}
#dock{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 76px);display:flex;flex-direction:column;gap:8px;z-index:5}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 92px);transform:translateX(-50%) translateY(-8px);background:var(--panel);border-radius:999px;padding:9px 18px;font-family:var(--display);font-weight:700;font-size:14px;color:var(--ink);box-shadow:0 6px 22px rgba(70,60,140,.18);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;max-width:calc(100vw - 40px);text-align:center;z-index:30}
#toast.show{opacity:1;transform:translateX(-50%)}

/* course card */
#card{position:fixed;z-index:10;background:var(--panel);backdrop-filter:blur(14px);box-shadow:0 24px 60px rgba(70,60,140,.25);overflow-y:auto;overscroll-behavior:contain}
@media (min-width:900px){#card{right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:400px;border-radius:26px;padding:14px;animation:slideIn .3s cubic-bezier(.2,1.2,.4,1)}
  body.card-open #dock{right:calc(max(16px,env(safe-area-inset-right,0px)) + 416px)}}
@media (max-width:899.98px){#card{left:0;right:0;bottom:0;max-height:72vh;border-radius:26px 26px 0 0;padding:12px max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(14px,env(safe-area-inset-left,0px));animation:sheetUp .3s cubic-bezier(.2,1.1,.4,1)}
  body.card-open #nav, body.card-open #dock{display:none}}
@keyframes slideIn{from{transform:translateX(30px);opacity:0}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}}
.card-img{position:relative;border-radius:20px;overflow:hidden;background:linear-gradient(#dff1ff,#fff3e6);aspect-ratio:4/3}
.card-img img{display:block;width:100%;height:100%;object-fit:cover}
.card-img .close{position:absolute;top:10px;right:10px}
.close{appearance:none;border:none;background:rgba(255,255,255,.9);width:36px;height:36px;border-radius:50%;cursor:pointer;color:var(--ink);font-size:20px;box-shadow:0 2px 8px rgba(70,60,140,.2)}
.card-body{padding:12px 6px 4px}
.cname{font-size:22px;line-height:1.15;margin-top:3px}
.th{font-size:13px;color:var(--muted);margin-top:2px}
.learn{font-size:15px;line-height:1.5;margin:10px 0 0;color:var(--ink)}
.sec{margin-top:16px}
.sec h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px}
.sec ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:13.5px;line-height:1.45}
.qbox{border-radius:18px;background:linear-gradient(#f3fff9,#eafaf3);padding:14px;margin-top:14px;box-shadow:inset 0 0 0 1.5px rgba(20,184,139,.25)}
.qbox .q{font-family:var(--display);font-weight:700;font-size:15.5px;line-height:1.35;margin-bottom:10px}
.opts{display:grid;gap:8px}
.opt{appearance:none;text-align:left;border:none;background:#fff;color:var(--ink);border-radius:14px;padding:11px 13px;cursor:pointer;font-size:14px;box-shadow:0 2px 0 rgba(20,184,139,.22),0 0 0 1.5px rgba(20,184,139,.18)}
.opt:hover:not([disabled]){box-shadow:0 2px 0 rgba(20,184,139,.4),0 0 0 2px var(--mint)}
.opt.right{background:#d6f8ea;box-shadow:0 0 0 2px var(--mint)}
.opt.wrong{background:#ffe1e9;box-shadow:0 0 0 2px var(--danger)}
.opt[disabled]{cursor:default}
